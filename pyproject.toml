[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leash"
version = "0.1.0"
description = "A permission and audit layer for AI agents that handle money (prototype; mock payments only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["leash"]

[tool.setuptools.package-data]
leash = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
